<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061f57">
  <title>Gerador de Senhas - Equipe Legado</title>
  <link rel="stylesheet" href="senha.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <a class="home-link" href="./index.html">← Voltar ao início</a>
      <h1>Gerador de Senhas</h1>
      <p>Crie senhas seguras para os seus acessos.</p>
    </header>

    <section class="card" aria-labelledby="random-title">
      <h2 id="random-title">Senha aleatória</h2>
      <output class="password-display empty" id="passwordDisplay">Nenhuma senha gerada ainda</output>
      <div class="button-group">
        <button class="btn-primary" id="generateBtn" type="button">Gerar senha</button>
        <button class="btn-secondary" id="copyBtn" type="button" disabled>Copiar</button>
      </div>
    </section>

    <section class="card" aria-labelledby="settings-title">
      <h2 id="settings-title">Configurações</h2>
      <div class="form-group">
        <label for="passwordLength">Tamanho: <strong id="lengthValue">12</strong> caracteres</label>
        <div class="range-container">
          <span>4</span>
          <input type="range" id="passwordLength" min="4" max="32" value="12">
          <span>32</span>
        </div>
      </div>

      <fieldset class="checkbox-group">
        <legend>Incluir caracteres</legend>
        <label><input type="checkbox" id="includeUppercase" checked> Maiúsculas (A-Z)</label>
        <label><input type="checkbox" id="includeLowercase" checked> Minúsculas (a-z)</label>
        <label><input type="checkbox" id="includeNumbers" checked> Números (0-9)</label>
        <label><input type="checkbox" id="includeSpecial" checked> Especiais (!@#$%&*)</label>
      </fieldset>
    </section>

    <section class="card" aria-labelledby="reference-title">
      <h2 id="reference-title">Senha com referência</h2>
      <div class="form-group">
        <label>Prefixo</label>
        <div class="radio-group">
          <label><input type="radio" name="prefixo" value="SRV" checked> SRV</label>
          <label><input type="radio" name="prefixo" value="SYS"> SYS</label>
        </div>
      </div>
      <div class="form-group">
        <label for="referenceInput">Dados de referência</label>
        <input type="text" id="referenceInput" placeholder="Ex.: PPDS ou DATABASE" autocomplete="off">
      </div>
      <output class="password-display empty" id="passwordReferenceDisplay">Digite uma referência para gerar</output>
      <div class="button-group">
        <button class="btn-primary" id="generateReferenceBtn" type="button">Gerar com referência</button>
        <button class="btn-secondary" id="copyBtnReference" type="button" disabled>Copiar</button>
      </div>
    </section>
  </main>

  <script src="senha.js"></script>
</body>
</html>
