<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061f57">
  <title>Geração de ID - Equipe Legado</title>
  <link rel="stylesheet" href="geracaoid.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <a class="home-link" href="./index.html">← Voltar ao início</a>
      <h1>Geração de ID de Usuário</h1>
      <p>Crie IDs a partir do nome completo.</p>
    </header>

    <section class="card" aria-labelledby="generator-title">
      <h2 id="generator-title">Dados do usuário</h2>
      <div class="form-group">
        <label for="nomeCompleto">Nome completo</label>
        <input type="text" id="nomeCompleto" placeholder="Ex.: Danillo Cesar" autocomplete="name">
      </div>

      <div class="results">
        <article class="result-box">
          <div>
            <p class="result-label">ID principal</p>
            <output class="result-value" id="idPrincipal">--------</output>
          </div>
          <button class="copy-btn" type="button" data-copy-target="idPrincipal">Copiar</button>
        </article>

        <article class="result-box">
          <div>
            <p class="result-label">ID com prefixo</p>
            <output class="result-value" id="idPrefixo">C_--------</output>
          </div>
          <button class="copy-btn" type="button" data-copy-target="idPrefixo">Copiar</button>
        </article>
      </div>

      <p class="info-text">Se o ID já existir, remova caracteres do sobrenome e gere novamente.</p>
    </section>
  </main>

  <script src="geracaoid.js"></script>
</body>
</html>
